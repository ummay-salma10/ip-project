<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      padding: 30px;
    }
    .table-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <div class="table-container">
    <h2>Student Academic Result</h2>
    
    <table>
      <thead>
        <tr>
          <th>Course Code</th>
          <th>Course Title</th>
          <th>Credit</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>CSE-111</td>
          <td>Structured Programming</td>
          <td>3.0</td>
          <td>A+</td>
        </tr>
        <tr>
          <td>CSE-112</td>
          <td>Object Oriented Programming</td>
          <td>3.0</td>
          <td>A+</td>
        </tr>
        <tr>
          <td>CSE-211</td>
          <td>Data Structures & Algorithms</td>
          <td>3.0</td>
          <td>A</td>
        </tr>
        <tr>
          <td>WEB-101</td>
          <td>Web Development Basics</td>
          <td>2.0</td>
          <td>A+</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
