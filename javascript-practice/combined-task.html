<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Combined Task</title>
</head>

<body>

    <h1>Student Information & Grade Calculator</h1>


    <script>

        
        // 1. STUDENT INFORMATION
      

        const university = "Premier University";

        let name = prompt("Enter your name:");

        let age = Number(prompt("Enter your age:"));

        let marks = Number(prompt("Enter your marks (0-100):"));


        // Display Student Information

        console.log("===== STUDENT INFORMATION =====");

        console.log(`Name: ${name}`);

        console.log(`Age: ${age}`);

        console.log(`University: ${university}`);

        console.log(`Marks: ${marks}`);

        // 2. AGE CHECK (if-else)

        console.log("===== AGE CHECK =====");

        if (age >= 18) {

            console.log("You are an Adult");

        }

        else {

            console.log("You are a Minor");

        }

        // 3. PASS / FAIL & GRADE CALCULATOR
        
        console.log("===== RESULT =====");

        if (marks < 0 || marks > 100) {

            console.log("Invalid Marks");

        }

        else if (marks >= 80) {

            console.log("Pass");

            console.log("Grade: A+");

        }

        else if (marks >= 70) {

            console.log("Pass");

            console.log("Grade: A");

        }

        else if (marks >= 60) {

            console.log("Pass");

            console.log("Grade: A-");

        }

        else if (marks >= 50) {

            console.log("Pass");

            console.log("Grade: B");

        }

        else if (marks >= 40) {

            console.log("Pass");

            console.log("Grade: C");

        }

        else {

            console.log("Fail");

            console.log("Grade: F");

        }

        // 4. EVEN / ODD CHECK

        console.log("===== EVEN OR ODD =====");

        let number = Number(prompt("Enter a number to check Even or Odd:"));

        if (number % 2 === 0) {

            console.log(`${number} is Even`);

        }

        else {

            console.log(`${number} is Odd`);

        }

        // 5. MINI CALCULATOR
    

        console.log("===== MINI CALCULATOR =====");

        let num1 = Number(prompt("Enter first number:"));

        let num2 = Number(prompt("Enter second number:"));


        // Arithmetic Operations

        let sum = num1 + num2;

        let subtraction = num1 - num2;

        let multiplication = num1 * num2;


        console.log("Addition:", sum);

        console.log("Subtraction:", subtraction);

        console.log("Multiplication:", multiplication);


        // Division Check

        if (num2 !== 0) {

            console.log("Division:", num1 / num2);

        }

        else {

            console.log("Cannot divide by zero");

        }


        // Assignment Operator

        let total = sum;

        total += 10;

        console.log("Sum + 10:", total);


        // 6. FIND THE LARGEST OF THREE NUMBERS

        console.log("===== LARGEST NUMBER =====");

        let a = Number(prompt("Enter first number:"));

        let b = Number(prompt("Enter second number:"));

        let c = Number(prompt("Enter third number:"));


        if (a >= b && a >= c) {

            console.log("Largest Number:", a);

        }

        else if (b >= a && b >= c) {

            console.log("Largest Number:", b);

        }

        else {

            console.log("Largest Number:", c);

        }

        // 7. SWITCH (DAY CHECKER)
       

        console.log("===== DAY CHECKER =====");

        let day = Number(prompt("Enter a number (1-7):"));


        switch (day) {

            case 1:
                console.log("Saturday");
                break;

            case 2:
                console.log("Sunday");
                break;

            case 3:
                console.log("Monday");
                break;

            case 4:
                console.log("Tuesday");
                break;

            case 5:
                console.log("Wednesday");
                break;

            case 6:
                console.log("Thursday");
                break;

            case 7:
                console.log("Friday");
                break;

            default:
                console.log("Invalid Day");

        }

        // 8. COMPARISON & LOGICAL OPERATORS
       
        console.log("===== COMPARISON CHECK =====");

        console.log("Age >= 18:", age >= 18);

        console.log("Marks >= 40:", marks >= 40);

        console.log("Age between 18 and 30:", age >= 18 && age <= 30);

        console.log("Age < 18 OR Marks >= 80:", age < 18 || marks >= 80);

        // 9. TYPE CONVERSION
        

        console.log("===== DATA TYPE =====");

        console.log("Age Data Type:", typeof age);

        console.log("Name Data Type:", typeof name);

        console.log("Marks Data Type:", typeof marks);


        console.log("FINNALY DONE");

        

    </script>

</body>

</html>
