<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Box Making</title>
    <style>
       *{
          box-sizing: border-box;
        }
        body {
          border: 5px solid green;
          background-color: lightblue;

        }
        .grid {
          display:grid;
          grid-template-columns: 1fr 2fr 1fr;
          gap: 5px 10px;
          padding: 10px;
        }
        .grid div {
          padding: 40px;
          text-align: center;
          font-size: 30px;
        }
        .header {
          border: 4px solid yellow;
          background-color: lightpink;
           grid-column: 1 / 4;
           grid-row: 1 / 2;
          position: sticky;
          top: 0;
          z-index: 1;
        }
        .menu1 {
      border: 4px solid purple;
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }
    .menu2 {
      border: 4px solid purple;
      grid-column: 1 / 2;
      grid-row: 3 / 4;
    }
      .main{
        border: 4px solid purple;
        grid-column: 2 / 3;
        grid-row: 2 / 4;
      }
      .sidebar1 {
        border: 4px solid purple;
        grid-column: 3 / 4;
        grid-row: 2 / 3;
      }
      .sidebar2 {
        border: 4px solid purple;
        grid-column: 3 / 4;
        grid-row: 3 / 4;
      }
      .footer {
      border: 4px solid greenyellow;
      background-color: royalblue;
      grid-column: 1 / 4;
      grid-row: 4 / 5;
    }
      
        
    </style>
</head>
<body>
    <div class="grid">

    <div class="header">Header</div>

    <div class="menu1">Menu 1</div>

    <div class="menu2">Menu 2</div>

    <div class="main">Main</div>

    <div class="sidebar1">sidebar 1</div>

    <div class="sidebar2">sidebar 2</div>

    <div class="footer">Footer</div>

  </div>
    
</body>
</html>
