<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      padding: 20px;
    }
    form {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      margin-top: 15px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <form>
    <h2>Course Registration</h2>
    
    <label for="name">Full Name *</label>
    <input type="text" id="name" name="fullname" placeholder="e.g. Ummay Salma" required minlength="3">

    <label for="student-id">Student ID *</label>
    <input type="text" id="student-id" name="studentId" placeholder="e.g. 2026-CSE-014" required>

    <label for="email">Email *</label>
    <input type="email" id="email" name="email" placeholder="e.g. salma@example.com" required>

    <label for="dept">Department *</label>
    <select id="dept" name="department" required>
      <option value="">Select Department</option>
      <option value="CSE">Computer Science & Engineering</option>
      <option value="EEE">Electrical & Electronic Engineering</option>
    </select>

    <button type="submit">Submit Registration</button>
  </form>

</body>
</html>
